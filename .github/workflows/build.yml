name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack zip
        run: |
          mkdir work
          unzip -q "$(ls *.zip | head -n 1)" -d work
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6
      - name: Build
        working-directory: work
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: coppergear-fabric
          path: work/build/libs/*.jar
